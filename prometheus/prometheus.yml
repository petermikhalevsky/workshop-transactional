global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: order-service
    metrics_path: /actuator/prometheus
    scrape_timeout: 1500ms
    static_configs:
      - targets: ["order-service:8081"]
        labels:
          service: order-service

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
